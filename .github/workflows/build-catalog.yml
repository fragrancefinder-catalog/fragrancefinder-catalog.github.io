name: Build FragranceFinder Catalog

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Publish Catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build catalog.json
        run: node scripts/build-catalog.js

      - name: Validate generated JSON
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const c = JSON.parse(
            fs.readFileSync(
              'catalog.json',
              'utf8'
            )
          );

          if (c.schemaVersion !== 1) {
            throw new Error(
              'Wrong schema version'
            );
          }

          if (
            !Array.isArray(c.readyFragrances) ||
            c.readyFragrances.length < 8
          ) {
            throw new Error(
              'Ready-fragrance catalog unexpectedly shrank'
            );
          }

          if (
            !Array.isArray(c.scentIndex) ||
            c.scentIndex.length < 125
          ) {
            throw new Error(
              'Discovery catalog unexpectedly shrank'
            );
          }

          const families =
            new Set(
              c.scentIndex.flatMap(
                entry =>
                  entry.observations.map(
                    observation =>
                      observation.family
                  )
              )
            );

          if (families.size !== 7) {
            throw new Error(
              'Not all 7 families are represented'
            );
          }

          const normalized =
            value =>
              String(value)
                .trim()
                .replace(/[®™℠©]/g, '')
                .replace(/&/g, ' and ')
                .replace(/[’']/g, '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, ' ')
                .trim()
                .replace(/\s+/g, ' ');

          const scentNames =
            new Set(
              c.scentIndex.map(
                entry =>
                  normalized(entry.name)
              )
            );

          for (
            const fragrance
            of c.readyFragrances
          ) {
            if (
              !scentNames.has(
                normalized(
                  fragrance.name
                )
              )
            ) {
              throw new Error(
                `Ready fragrance missing from scent index: ${fragrance.name}`
              );
            }
          }

          const bootstrap =
            c.scentIndex.some(
              entry =>
                entry.observations.some(
                  observation =>
                    observation.productType ===
                    'Bootstrap recommendation-ready scent'
                )
            );

          if (bootstrap) {
            throw new Error(
              'Bootstrap observations remain'
            );
          }

          console.log(
            'catalog.json validation passed'
          );
          NODE

      - name: Write job summary
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');

          const c = JSON.parse(
            fs.readFileSync(
              'catalog.json',
              'utf8'
            )
          );

          const families =
            new Set(
              c.scentIndex.flatMap(
                entry =>
                  entry.observations.map(
                    observation =>
                      observation.family
                  )
              )
            );

          console.log(
            '## FragranceFinder Catalog Build'
          );

          console.log('');

          console.log(
            `**Ready fragrances:** ${c.readyFragrances.length}`
          );

          console.log(
            `**Scent identities:** ${c.scentIndex.length}`
          );

          console.log(
            `**Families:** ${families.size}/7`
          );

          console.log('');

          console.log(
            'Recommendation-ready data loaded from `data/enrichment/*.json`.'
          );

          console.log(
            'Bootstrap observations removed.'
          );
          NODE

      - name: Commit generated catalog
        shell: bash
        run: |
          git config user.name "fragrancefinder-catalog"
          git config user.email "actions@users.noreply.github.com"

          git add catalog.json

          if git diff --cached --quiet; then
            echo "catalog.json is already current."
            exit 0
          fi

          git commit -m "Build catalog from enrichment data"
          git push
